<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nexus Brand Template</title>
  <style>
    :root {
      --bg1: #050812;
      --bg2: #080411;
      --cyan: #48f0ff;
      --purple: #a855f7;
      --text: #f5fbff;
      --muted: rgba(245,251,255,.78);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1080px;
      height: 1350px;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 56px 72px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 16%, rgba(72,240,255,.22), transparent 34%),
        radial-gradient(circle at 84% 12%, rgba(168,85,247,.26), transparent 36%),
        linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.58)),
        url('/root/.openclaw/workspace/workspace_projetos/projetos/marketing-nexus/marketing/assets/library/Nexus/brand_ai/dreamina-2026-04-05-3983-Uma representação abstrata de computação....jpeg') center/cover no-repeat;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.04);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(5,8,18,.92) 0%, rgba(5,8,18,.68) 34%, rgba(5,8,18,.52) 58%, rgba(5,8,18,.92) 100%);
    }

    .top-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
      opacity: .9;
    }

    .brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 18px;
      color: rgba(245,251,255,.92);
    }
    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.2);
    }

    .stack {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 900px;
      margin-top: 36px;
    }

    .eyebrow {
      color: rgba(72,240,255,.88);
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: 800;
    }

    .headline {
      font-size: 92px;
      line-height: .92;
      font-weight: 950;
      margin: 0;
      text-wrap: balance;
      text-shadow: 0 18px 80px rgba(0,0,0,.55);
    }

    .sub {
      font-size: 30px;
      line-height: 1.35;
      color: rgba(245,251,255,.84);
      max-width: 820px;
      margin: 0;
      text-shadow: 0 10px 50px rgba(0,0,0,.45);
    }

    .cta-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: auto;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      padding: 18px 26px;
      border-radius: 999px;
      background: rgba(7,11,20,.40);
      border: 1px solid rgba(72,240,255,.28);
      color: var(--text);
      font-size: 22px;
      font-weight: 850;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .progress {
      font-size: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(245,251,255,.65);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(7,11,20,.26);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
    }

    /* Token used by other templates; safe no-op here */
    .continue-hint { display: none; }
  </style>
</head>
<body>
  <div class="hero"></div>
  <div class="vignette"></div>
  <div class="top-line"></div>

  <div class="frame">
    <div class="brand">
      <img src="https://insta-marketing.ias-nexus-automacao.com.br/nexus-logo.jpg" alt="Nexus" />
      <div>Nexus Automação</div>
    </div>

    <div class="stack">
      <div class="eyebrow">Custo invisível</div>
      <h1 class="headline">O maior custo do seu negócio é invisível.</h1>
      <p class="sub">Tempo perdido em processos que ninguém mede.</p>
    </div>

    <div class="cta-row">
      <div class="cta">Deslize: onde o tempo some</div>
      <div class="progress">1/5</div>
    </div>
  </div>
</body>
</html>
