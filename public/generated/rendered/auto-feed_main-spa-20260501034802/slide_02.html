<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nexus Carousel Template</title>
  <style>
    :root {
      --bg1: #0a0507;
      --bg2: #180d0a;
      --glow: rgba(167, 102, 62, 0.35);
      --text: #f7eee8;
      --muted: rgba(247, 238, 232, 0.78);
      --accent: #ff6a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1080px;
      height: 1350px;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, var(--glow), transparent 34%),
        radial-gradient(circle at 52% 38%, rgba(112, 58, 30, 0.28), transparent 50%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 70px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 18px;
    }
    .brand img {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 14px 34px rgba(0,0,0,.22);
    }
    .content {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      gap: 28px;
      align-items: center;
      min-width: 0;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: rgba(255,255,255,.72);
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: 18px;
      font-weight: 800;
      min-height: 22px;
    }
    .headline {
      font-size: 66px;
      line-height: .98;
      font-weight: 900;
      margin: 0 0 20px;
      max-width: 430px;
      width: 100%;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .sub {
      margin: 0;
      font-size: 30px;
      line-height: 1.38;
      color: var(--muted);
      max-width: 400px;
      width: 100%;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .visual {
      height: 980px;
      border-radius: 42px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),
        url('/root/.openclaw/workspace/marketing/assets/library/spa/dreamina-2026-04-05-2448-Uma terapeuta aplicando uma compressa de....jpeg') center/cover no-repeat,
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.10), transparent 40%),
        linear-gradient(180deg, #2b1b16, #120b0a);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
    }
    .visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.32));
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 24px;
      font-weight: 800;
      width: fit-content;
      box-shadow: 0 20px 50px rgba(255,106,0,.24);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <img src="https://insta-marketing.ias-nexus-automacao.com.br/nexus-logo.jpg" alt="Nexus" />
      <div>Nexus Automação</div>
    </div>

    <div class="content">
      <div>
        <h1 class="headline">Quando a rotina no spa trava, agenda e atendimento sentem primeiro.</h1>
        <p class="sub">Agenda e atendimento sentem primeiro</p>
      </div>
      <div class="visual"></div>
    </div>

    <div class="cta">Continue deslizando</div>
  </div>
</body>
</html>
